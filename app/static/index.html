<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Tornillo Feliz · Asistente virtual</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="chat-widget">
    <header class="chat-header">
      <div class="chat-header-info">
        <div class="chat-avatar">TF</div>
        <div>
          <h1>El Tornillo Feliz</h1>
          <p class="chat-status"><span class="status-dot"></span>Asistente virtual · en línea</p>
        </div>
      </div>
      <button id="new-conversation-btn" class="btn-new-conversation" type="button">
        Nueva conversación
      </button>
    </header>

    <div id="escalation-banner" class="escalation-banner" hidden></div>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="typing-indicator" class="typing-indicator" hidden>
      <span></span><span></span><span></span>
    </div>

    <form id="chat-form" class="chat-input-bar">
      <input
        id="message-input"
        type="text"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
        maxlength="1000"
      />
      <button id="send-btn" type="submit">Enviar</button>
    </form>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
